name: build

on:
  push:
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v

  windows-exe:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write  # lets release builds attach the exe to the GitHub release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
      - name: Stamp version from the release tag
        if: github.event_name == 'release'
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${TAG#v}"
          version="${version//[^A-Za-z0-9._-]/}"
          sed -i "s/^__version__ = .*/__version__ = \"${version}\"/" baw/__init__.py
      - run: pip install pyinstaller Pillow
      - run: pyinstaller --noconfirm --onefile --windowed --name BetterAchievementWatcher BetterAchievementWatcher.pyw
      - uses: actions/upload-artifact@v4
        with:
          name: BetterAchievementWatcher-windows
          path: dist/BetterAchievementWatcher.exe
      - name: Attach exe to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: dist/BetterAchievementWatcher.exe
