name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v

  windows-exe:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write  # lets tag builds attach the exe to the GitHub release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
      - name: Stamp version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: sed -i "s/^__version__ = .*/__version__ = \"${GITHUB_REF_NAME#v}\"/" baw/__init__.py
      - run: pip install pyinstaller Pillow
      - run: pyinstaller --noconfirm --onefile --windowed --name BetterAchievementWatcher BetterAchievementWatcher.pyw
      - uses: actions/upload-artifact@v4
        with:
          name: BetterAchievementWatcher-windows
          path: dist/BetterAchievementWatcher.exe
      - name: Attach exe to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/BetterAchievementWatcher.exe
          generate_release_notes: true
