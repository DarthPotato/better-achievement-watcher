name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v

  windows-exe:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
      - run: pip install pyinstaller Pillow
      - run: pyinstaller --noconfirm --onefile --windowed --name BetterAchievementWatcher BetterAchievementWatcher.pyw
      - uses: actions/upload-artifact@v4
        with:
          name: BetterAchievementWatcher-windows
          path: dist/BetterAchievementWatcher.exe
